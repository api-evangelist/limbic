  name: UKCA Class IIa medical device (MDR / UK MDR 2002)
  conforms: true
  evidence: >-
    "Limbic is the only mental health AI chatbot with Class IIa medical device
    certification (UK)." — https://www.limbic.ai/faq. Also stated on
    https://www.limbic.ai/access as "a Class IIa medical device for conversational
    patient intake and clinical decision support in behavioral health services".
  scope: Limbic Access
- id: hipaa
  name: HIPAA
  conforms: true
  evidence: >-
    "In addition to our Class IIa medical device status, we are HIPAA- and
