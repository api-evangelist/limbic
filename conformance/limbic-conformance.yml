name: Limbic — Conformance & Compliance
summary: >-
  Limbic publishes its compliance and regulatory posture on its public FAQ and product
  pages. It is a regulated medical-device vendor rather than an API platform: the
  claims below are clinical-safety and information-security programs, not API-protocol
  conformance. Limbic publishes no OpenAPI, OAuth or event specifications, so no
  API-protocol conformance can be asserted.
standards:
