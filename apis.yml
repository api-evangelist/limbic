aid: limbic
name: Limbic
description: 'Limbic is a clinical AI company for mental healthcare, founded in 2020
  and headquartered in New York with a London engineering base. Its two products —
  Limbic Access, a Class IIa (UKCA) medical device for conversational patient intake,
  assessment and clinical decision support, and Limbic Care, an AI companion delivering
  guided CBT and on-demand support between therapy sessions — are embedded by health
  plans, health systems, behavioral health providers and NHS Talking Therapies services.
  Both are built on the proprietary "Limbic Layer", a clinical reasoning layer that
  sits between the user and a large language model to enforce validated clinical guidance.
  Limbic Access embeds into a provider website with a small script snippet rather than
  a public developer API; the company publishes no developer portal, OpenAPI definitions
  or SDKs, and integrates with EHR and patient management systems through customer
  engagements. Research code accompanying its peer-reviewed studies (including work
  published in Nature Medicine) is open on GitHub.'
